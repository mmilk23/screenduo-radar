name: OWASP Dependency Check

on:
  pull_request:
    branches: [ "main", "development" ]
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPENDENCY_CHECK_CACHE: ${{ github.workspace }}/.dependency-check-cache
      DEPENDENCY_CHECK_DATA: ${{ github.workspace }}/.dependency-check-data

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: graalvm
          cache: maven

      - name: Generate weekly cache key
        id: cache-key
        shell: bash
        run: echo "week=$(date -u +'%G-%V')" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPENDENCY_CHECK_CACHE }}
          key: dependency-check-data-v4-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-v4-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-
            dependency-check-data-v4-${{ runner.os }}-

      - name: Prepare OWASP working data
        shell: bash
        run: |
          rm -rf "${DEPENDENCY_CHECK_DATA}"
          mkdir -p "${DEPENDENCY_CHECK_DATA}"

          if [ -d "${DEPENDENCY_CHECK_CACHE}" ] && [ "$(find "${DEPENDENCY_CHECK_CACHE}" -mindepth 1 -print -quit)" ]; then
            cp -a "${DEPENDENCY_CHECK_CACHE}/." "${DEPENDENCY_CHECK_DATA}/"
          fi

      - name: Run OWASP Dependency-Check
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CACHE_MATCHED_KEY: ${{ steps.dependency-check-cache.outputs.cache-matched-key }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          is_dependabot_pr=false
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${ACTOR}" = "dependabot[bot]" ]; then
            is_dependabot_pr=true
          fi

          if [ "${is_dependabot_pr}" = true ] && [ -z "${CACHE_MATCHED_KEY}" ]; then
            echo "::warning::Skipping OWASP Dependency-Check for this Dependabot PR because Actions secrets are unavailable and no reusable NVD cache was found."
            {
              echo "### OWASP Dependency-Check"
              echo
              echo "Scan skipped for this Dependabot PR: the NVD API key is intentionally unavailable to Dependabot, and no reusable Dependency-Check cache was found."
              echo "A scheduled or manually dispatched run can refresh the shared cache."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          run_check() {
            args=(
              mvn -B -Pdependency-check dependency-check:check
              -DskipTests
              "-DdataDirectory=${DEPENDENCY_CHECK_DATA}"
              --file pom.xml
            )

            if [ -n "${NVD_API_KEY}" ]; then
              args+=("-DnvdApiKey=${NVD_API_KEY}")
            fi

            # Pull requests consume an existing cache without updating it.
            # Scheduled/manual runs are allowed to refresh NVD data.
            if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${CACHE_MATCHED_KEY}" ]; then
              args+=("-DautoUpdate=false")
            fi

            "${args[@]}"
          }

          if ! run_check; then
            if [ "${is_dependabot_pr}" = true ]; then
              echo "::error::The cached Dependency-Check database could not be used, and Dependabot cannot access the NVD API key."
              exit 1
            fi

            if [ -z "${CACHE_MATCHED_KEY}" ] || [ -z "${NVD_API_KEY}" ]; then
              exit 1
            fi

            echo "Cached Dependency-Check data failed; retrying once with a clean database."
            rm -rf "${DEPENDENCY_CHECK_DATA}"
            mkdir -p "${DEPENDENCY_CHECK_DATA}"
            CACHE_MATCHED_KEY=""
            run_check
          fi

      - name: Refresh cache staging directory
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf "${DEPENDENCY_CHECK_CACHE}"
          mkdir -p "${DEPENDENCY_CHECK_CACHE}"
          cp -a "${DEPENDENCY_CHECK_DATA}/." "${DEPENDENCY_CHECK_CACHE}/"

      - name: Save OWASP Dependency-Check data
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPENDENCY_CHECK_CACHE }}
          key: dependency-check-data-v4-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-${{ github.run_id }}

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
